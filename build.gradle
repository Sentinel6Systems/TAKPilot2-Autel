// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '1.7.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        //*/
        classpath 'com.android.tools.build:gradle:7.2.2'
        /*/
        classpath 'com.android.tools.build:gradle:3.0.0'
        //*/
//        classpath 'me.vigi:fat-aar-plugin:0.2.8'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.20"
//        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// The sample's publishing plugins (Artifactory, fat-aar) and its regional Maven mirrors are not
// used to build this app. Google and Maven Central come first: a mirror that answers with a
// server error stops dependency resolution outright instead of falling through to the next one.
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}


task clean(type: Delete) {
    delete rootProject.buildDir
}
